<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winnie's Town</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
    // ─────────────────────────────────────────────────────────────────────────
    // BOOT SCENE  –  load every asset, show a progress bar
    // ─────────────────────────────────────────────────────────────────────────
    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }

        preload() {
            const W = this.scale.width;
            const H = this.scale.height;

            const barBg = this.add.rectangle(W / 2, H / 2, W * 0.6, 20, 0x334455);
            const bar   = this.add.rectangle(W / 2 - W * 0.3, H / 2, 4, 16, 0xa8d8a8).setOrigin(0, 0.5);
            this.add.text(W / 2, H / 2 - 36, "Loading Winnie's Town…", {
                fontSize: '18px', fill: '#d4e6d4', fontFamily: 'Georgia, serif'
            }).setOrigin(0.5);

            this.load.on('progress', v => bar.setSize(Math.max(4, W * 0.6 * v), 16));

            // ── assets (main folder only) ──
            this.load.image('cafefront',       'assets/cafefront.png');
            this.load.image('insidecafe',      'assets/insidecafe.png');
            this.load.image('map',             'assets/map.png');
            this.load.image('mapbutton',       'assets/mapbutton.png');
            this.load.image('shopbutton',      'assets/shopbutton.png');
            this.load.image('decoratebutton',  'assets/decoratebutton.png');
            this.load.image('camerabutton',    'assets/camerabutton.png');
            this.load.image('starsholder',     'assets/starsholder.png');
            this.load.image('currencyholder',  'assets/currencyholder.png');

            // enterbutton — graceful fallback if file not yet present
            this.load.on('filecomplete-image-enterbutton', () => { this.enterBtnLoaded = true; });
            this.load.image('enterbutton', 'assets/enterbutton.png');
        }

        create() {
            this.scene.start('CafeFrontScene', { enterBtnLoaded: this.enterBtnLoaded });
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // SHARED HELPERS  –  leaf textures + spawn
    // ─────────────────────────────────────────────────────────────────────────
    function buildLeafTextures(scene) {
        const defs = [
            { w: 24, h: 12, fill: 0x4e9a40, stem: 0x2d5a1b },
            { w: 18, h: 18, fill: 0x6ab64c, stem: 0x336622 },
            { w: 30, h: 11, fill: 0x79b341, stem: 0x3a6a18 },
            { w: 22, h: 13, fill: 0xb5c226, stem: 0x6a7310 },
            { w: 16, h: 16, fill: 0x8bc34a, stem: 0x4a6e20 },
        ];
        defs.forEach((d, i) => {
            if (scene.textures.exists(`leaf${i}`)) return;
            const g = scene.make.graphics({ add: false });
            g.fillStyle(d.fill, 1);
            g.fillEllipse(d.w / 2, d.h / 2, d.w, d.h);
            g.lineStyle(1, d.stem, 0.6);
            g.beginPath(); g.moveTo(d.w / 2, 1); g.lineTo(d.w / 2, d.h - 1); g.strokePath();
            g.generateTexture(`leaf${i}`, d.w, d.h);
            g.destroy();
        });
    }

    function spawnLeaf(scene, fillScreen = false) {
        const W = scene.scale.width;
        const H = scene.scale.height;
        const idx  = Phaser.Math.Between(0, 4);
        const x    = Phaser.Math.Between(-20, W + 20);
        const y    = fillScreen ? Phaser.Math.Between(-40, H * 0.65) : Phaser.Math.Between(-40, -10);
        const leaf = scene.add.image(x, y, `leaf${idx}`)
            .setScale(Phaser.Math.FloatBetween(0.55, 1.3))
            .setAlpha(Phaser.Math.FloatBetween(0.65, 1.0))
            .setDepth(5);
        const fallMs = Phaser.Math.Between(6000, 13000);
        const swayPx = Phaser.Math.Between(20, 65);
        scene.tweens.add({ targets: leaf, y: H + 60, duration: fallMs, ease: 'Linear', onComplete: () => leaf.destroy() });
        scene.tweens.add({ targets: leaf, x: x + swayPx, duration: Phaser.Math.Between(900, 2000), ease: 'Sine.InOut', yoyo: true, repeat: -1 });
        scene.tweens.add({ targets: leaf, angle: Phaser.Math.Between(120, 260) * (Math.random() < 0.5 ? 1 : -1), duration: Phaser.Math.Between(700, 2200), ease: 'Sine.InOut', yoyo: true, repeat: -1 });
    }

    function startLeaves(scene) {
        buildLeafTextures(scene);
        for (let i = 0; i < 10; i++) scene.time.delayedCall(i * 150, () => spawnLeaf(scene, true));
        scene.time.addEvent({ delay: 650, callback: () => spawnLeaf(scene, false), loop: true });
    }

    function addTopUI(scene) {
        const W = scene.scale.width;
        const H = scene.scale.height;
        const maxH = H * 0.075;
        const maxW = W * 0.44;

        const stars = scene.add.image(10, H * 0.065, 'starsholder').setOrigin(0, 0.5).setDepth(20);
        stars.setScale(Math.min(maxW / stars.width, maxH / stars.height));

        const currency = scene.add.image(W - 10, H * 0.065, 'currencyholder').setOrigin(1, 0.5).setDepth(20);
        currency.setScale(Math.min(maxW / currency.width, maxH / currency.height));
    }

    function addBottomButtons(scene) {
        const W = scene.scale.width;
        const H = scene.scale.height;
        const buttons = [
            { key: 'mapbutton',      action: () => scene.scene.start('MapScene') },
            { key: 'shopbutton',     action: () => console.log('Shop') },
            { key: 'decoratebutton', action: () => console.log('Decorate') },
            { key: 'camerabutton',   action: () => console.log('Camera') },
        ];

        // 3× larger than original
        const btnTargetH = Math.min(H * 0.255, 225);
        const bottomY    = H - btnTargetH * 0.58;
        const totalSpan  = W - 80;
        const step       = totalSpan / (buttons.length - 1);
        const startX     = 40;

        const group = [];

        buttons.forEach(({ key, action }, i) => {
            const x   = startX + i * step;
            const btn = scene.add.image(x, bottomY, key).setDepth(20);
            const sc  = btnTargetH / btn.height;
            btn.setScale(sc);
            btn.setInteractive({ useHandCursor: true });

            btn.on('pointerover', () => {
                scene.tweens.killTweensOf(btn);
                scene.tweens.add({ targets: btn, scale: sc * 1.12, duration: 100, ease: 'Back.Out' });
            });
            btn.on('pointerout', () => {
                scene.tweens.killTweensOf(btn);
                scene.tweens.add({ targets: btn, scale: sc, duration: 120, ease: 'Linear' });
            });
            btn.on('pointerdown', () => {
                scene.tweens.killTweensOf(btn);
                scene.tweens.add({ targets: btn, scale: sc * 0.88, duration: 80, ease: 'Linear', yoyo: true, onComplete: action });
            });
            group.push(btn);
        });

        return group;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // CAFE FRONT SCENE  –  exterior, enter button, no HUD until enter pressed
    // ─────────────────────────────────────────────────────────────────────────
    class CafeFrontScene extends Phaser.Scene {
        constructor() { super({ key: 'CafeFrontScene' }); }

        create(data) {
            const W = this.scale.width;
            const H = this.scale.height;

            // Background
            const bg = this.add.image(W / 2, H / 2, 'cafefront');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            // Leaves
            startLeaves(this);

            // Top UI
            addTopUI(this);

            // ── Enter button (centre of screen) ───────────────────────────
            const enterBtnSize = Math.min(W * 0.45, H * 0.18);
            let enterBtn;

            if (data && data.enterBtnLoaded) {
                enterBtn = this.add.image(W / 2, H / 2, 'enterbutton').setDepth(15);
                const sc = Math.min(enterBtnSize / enterBtn.width, enterBtnSize / enterBtn.height);
                enterBtn.setScale(sc);
            } else {
                // Fallback: draw a rounded pill button
                const g = this.make.graphics({ add: false });
                const bw = Math.round(enterBtnSize * 2.2);
                const bh = Math.round(enterBtnSize * 0.7);
                const r  = bh / 2;
                g.fillStyle(0xf9c6d0, 1);
                g.fillRoundedRect(0, 0, bw, bh, r);
                g.lineStyle(3, 0xe07a8c, 1);
                g.strokeRoundedRect(0, 0, bw, bh, r);
                g.generateTexture('enterbutton_fb', bw, bh);
                g.destroy();

                enterBtn = this.add.image(W / 2, H / 2, 'enterbutton_fb').setDepth(15);
                this.add.text(W / 2, H / 2, 'ENTER', {
                    fontSize: Math.round(bh * 0.42) + 'px',
                    fill: '#7a3040',
                    fontFamily: 'Georgia, serif',
                    fontStyle: 'bold'
                }).setOrigin(0.5).setDepth(16);
            }

            // Pulse tween
            this.tweens.add({
                targets: enterBtn,
                scale: enterBtn.scale * 1.12,
                duration: 800,
                ease: 'Sine.InOut',
                yoyo: true,
                repeat: -1
            });

            // Click → go to InsideCafeScene
            enterBtn.setInteractive({ useHandCursor: true });
            enterBtn.on('pointerdown', () => {
                this.tweens.killTweensOf(enterBtn);
                this.cameras.main.fadeOut(400, 0, 0, 0);
                this.cameras.main.once('camerafadeoutcomplete', () => {
                    this.scene.start('InsideCafeScene');
                });
            });
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // INSIDE CAFE SCENE  –  interior view + full HUD
    // ─────────────────────────────────────────────────────────────────────────
    class InsideCafeScene extends Phaser.Scene {
        constructor() { super({ key: 'InsideCafeScene' }); }

        create() {
            const W = this.scale.width;
            const H = this.scale.height;

            this.cameras.main.fadeIn(400, 0, 0, 0);

            const bg = this.add.image(W / 2, H / 2, 'insidecafe');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            startLeaves(this);
            addTopUI(this);
            addBottomButtons(this);
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // MAP SCENE  –  full-screen map
    // ─────────────────────────────────────────────────────────────────────────
    class MapScene extends Phaser.Scene {
        constructor() { super({ key: 'MapScene' }); }

        create() {
            const W = this.scale.width;
            const H = this.scale.height;

            this.cameras.main.fadeIn(350, 0, 0, 0);

            const bg = this.add.image(W / 2, H / 2, 'map');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            // Back button – top-left "✕" pill
            const backW = Math.min(W * 0.18, 90);
            const backH = Math.min(H * 0.055, 46);
            const g = this.add.graphics().setDepth(20);
            g.fillStyle(0x000000, 0.45);
            g.fillRoundedRect(16, 16, backW, backH, backH / 2);

            const backText = this.add.text(16 + backW / 2, 16 + backH / 2, '✕  Back', {
                fontSize: Math.round(backH * 0.5) + 'px',
                fill: '#ffffff',
                fontFamily: 'Arial, sans-serif'
            }).setOrigin(0.5).setDepth(21);

            const backZone = this.add.zone(16, 16, backW, backH).setOrigin(0).setDepth(22).setInteractive({ useHandCursor: true });
            backZone.on('pointerdown', () => {
                this.cameras.main.fadeOut(350, 0, 0, 0);
                this.cameras.main.once('camerafadeoutcomplete', () => {
                    this.scene.start('InsideCafeScene');
                });
            });
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // PHASER CONFIG
    // ─────────────────────────────────────────────────────────────────────────
    const config = {
        type: Phaser.AUTO,
        backgroundColor: '#1a1a2e',
        scale: {
            mode: Phaser.Scale.RESIZE,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
        },
        scene: [BootScene, CafeFrontScene, InsideCafeScene, MapScene]
    };

    new Phaser.Game(config);
    </script>
</body>
</html>
