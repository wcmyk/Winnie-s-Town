<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winnie's Town</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
    // ─────────────────────────────────────────────────────────────────────────
    // BOOT SCENE
    // ─────────────────────────────────────────────────────────────────────────
    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }

        preload() {
            const W = this.scale.width;
            const H = this.scale.height;

            const bar = this.add.rectangle(W / 2 - W * 0.3, H / 2, 4, 16, 0xa8d8a8).setOrigin(0, 0.5);
            this.add.rectangle(W / 2, H / 2, W * 0.6, 20, 0x334455);
            this.add.text(W / 2, H / 2 - 36, "Loading Winnie's Town…", {
                fontSize: '18px', fill: '#d4e6d4', fontFamily: 'Georgia, serif'
            }).setOrigin(0.5);
            this.load.on('progress', v => bar.setSize(Math.max(4, W * 0.6 * v), 16));

            // Scenes
            this.load.image('cafefront',      'assets/cafefront.png');
            this.load.image('insidecafe',     'assets/insidecafe.png');
            this.load.image('map',            'assets/map.png');
            // UI — v2 versions
            this.load.image('enterbutton2',   'assets/enterbutton2.png');
            this.load.image('mapbutton2',     'assets/mapbutton2.png');
            this.load.image('shopbutton2',    'assets/shopbutton2.png');
            this.load.image('decoratebutton2','assets/decoratebutton2.png');
            this.load.image('camerabutton2',  'assets/camerabutton2.png');
            this.load.image('starsholder2',   'assets/starsholder2.png');
            this.load.image('currencyholder2','assets/currencyholder2.png');
            // Inventory overlay
            this.load.image('inventory_screen','assets/inventory_screen.png');
        }

        create() { this.scene.start('CafeFrontScene'); }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // SHARED HELPERS
    // ─────────────────────────────────────────────────────────────────────────
    function buildLeafTextures(scene) {
        const defs = [
            { w: 24, h: 12, fill: 0x4e9a40, stem: 0x2d5a1b },
            { w: 18, h: 18, fill: 0x6ab64c, stem: 0x336622 },
            { w: 30, h: 11, fill: 0x79b341, stem: 0x3a6a18 },
            { w: 22, h: 13, fill: 0xb5c226, stem: 0x6a7310 },
            { w: 16, h: 16, fill: 0x8bc34a, stem: 0x4a6e20 },
        ];
        defs.forEach((d, i) => {
            if (scene.textures.exists(`leaf${i}`)) return;
            const g = scene.make.graphics({ add: false });
            g.fillStyle(d.fill, 1);
            g.fillEllipse(d.w / 2, d.h / 2, d.w, d.h);
            g.lineStyle(1, d.stem, 0.6);
            g.beginPath(); g.moveTo(d.w / 2, 1); g.lineTo(d.w / 2, d.h - 1); g.strokePath();
            g.generateTexture(`leaf${i}`, d.w, d.h);
            g.destroy();
        });
    }

    function spawnLeaf(scene, fillScreen) {
        const W = scene.scale.width, H = scene.scale.height;
        const idx = Phaser.Math.Between(0, 4);
        const x   = Phaser.Math.Between(-20, W + 20);
        const y   = fillScreen ? Phaser.Math.Between(-40, H * 0.65) : Phaser.Math.Between(-40, -10);
        const leaf = scene.add.image(x, y, `leaf${idx}`)
            .setScale(Phaser.Math.FloatBetween(0.55, 1.3))
            .setAlpha(Phaser.Math.FloatBetween(0.65, 1.0))
            .setDepth(5);
        const fallMs = Phaser.Math.Between(6000, 13000);
        scene.tweens.add({ targets: leaf, y: H + 60, duration: fallMs, ease: 'Linear', onComplete: () => leaf.destroy() });
        scene.tweens.add({ targets: leaf, x: x + Phaser.Math.Between(20, 65), duration: Phaser.Math.Between(900, 2000), ease: 'Sine.InOut', yoyo: true, repeat: -1 });
        scene.tweens.add({ targets: leaf, angle: Phaser.Math.Between(120, 260) * (Math.random() < 0.5 ? 1 : -1), duration: Phaser.Math.Between(700, 2200), ease: 'Sine.InOut', yoyo: true, repeat: -1 });
    }

    function startLeaves(scene) {
        buildLeafTextures(scene);
        for (let i = 0; i < 10; i++) scene.time.delayedCall(i * 150, () => spawnLeaf(scene, true));
        scene.time.addEvent({ delay: 650, callback: () => spawnLeaf(scene, false), loop: true });
    }

    function addTopUI(scene) {
        const W = scene.scale.width, H = scene.scale.height;
        const maxH = H * 0.08, maxW = W * 0.44;
        const stars = scene.add.image(10, H * 0.065, 'starsholder2').setOrigin(0, 0.5).setDepth(20);
        stars.setScale(Math.min(maxW / stars.width, maxH / stars.height));
        const currency = scene.add.image(W - 10, H * 0.065, 'currencyholder2').setOrigin(1, 0.5).setDepth(20);
        currency.setScale(Math.min(maxW / currency.width, maxH / currency.height));
    }

    // Bottom HUD — grouped tightly in centre-bottom
    function addBottomButtons(scene, onDecorate) {
        const W = scene.scale.width, H = scene.scale.height;

        const btnDefs = [
            { key: 'mapbutton2',      action: () => { scene.cameras.main.fadeOut(300, 0,0,0); scene.cameras.main.once('camerafadeoutcomplete', () => scene.scene.start('MapScene')); } },
            { key: 'shopbutton2',     action: () => console.log('Shop') },
            { key: 'decoratebutton2', action: onDecorate },
            { key: 'camerabutton2',   action: () => console.log('Camera') },
        ];

        // Target height — large enough to be tappable
        const btnH = Math.min(H * 0.14, 120);
        const gap  = Math.min(W * 0.03, 22);   // tight gap between buttons
        const bottomY = H - btnH * 0.55;

        // Pre-measure to find total group width and centre it
        const tempImgs = btnDefs.map(d => scene.textures.get(d.key).getSourceImage());
        const scales   = tempImgs.map(img => btnH / img.height);
        const widths   = tempImgs.map((img, i) => img.width * scales[i]);
        const totalW   = widths.reduce((a, b) => a + b, 0) + gap * (btnDefs.length - 1);
        let curX = (W - totalW) / 2;

        btnDefs.forEach(({ key, action }, i) => {
            const sc  = scales[i];
            const btn = scene.add.image(curX + widths[i] / 2, bottomY, key).setDepth(20);
            btn.setScale(sc);
            btn.setInteractive({ useHandCursor: true });
            btn.on('pointerover', () => { scene.tweens.killTweensOf(btn); scene.tweens.add({ targets: btn, scale: sc * 1.1, duration: 100, ease: 'Back.Out' }); });
            btn.on('pointerout',  () => { scene.tweens.killTweensOf(btn); scene.tweens.add({ targets: btn, scale: sc, duration: 120, ease: 'Linear' }); });
            btn.on('pointerdown', () => {
                scene.tweens.killTweensOf(btn);
                scene.tweens.add({ targets: btn, scale: sc * 0.88, duration: 80, ease: 'Linear', yoyo: true, onComplete: action });
            });
            curX += widths[i] + gap;
        });
    }

    // Inventory overlay — shown over any scene
    function showInventoryOverlay(scene) {
        const W = scene.scale.width, H = scene.scale.height;

        // Dim backdrop
        const dim = scene.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.55).setDepth(50).setInteractive();

        // Inventory panel — scales to fit screen with padding
        const padding = Math.min(W, H) * 0.05;
        const inv = scene.add.image(W / 2, H / 2, 'inventory_screen').setDepth(51);
        const sc  = Math.min((W - padding * 2) / inv.width, (H - padding * 2) / inv.height);
        inv.setScale(sc);
        inv.setAlpha(0);
        inv.setScale(sc * 0.85);

        // Slide-in tween
        scene.tweens.add({ targets: inv, scale: sc, alpha: 1, duration: 280, ease: 'Back.Out' });

        // Close on tap outside (or anywhere — tap inventory itself to close too)
        const close = () => {
            scene.tweens.add({
                targets: [inv, dim], alpha: 0, scale: { value: sc * 0.85, duration: 180 },
                duration: 180, ease: 'Linear',
                onComplete: () => { dim.destroy(); inv.destroy(); }
            });
        };
        dim.on('pointerdown', close);
        inv.setInteractive();
        inv.on('pointerdown', close);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // CAFE FRONT SCENE  — exterior, pulsing enter button, NO bottom HUD
    // ─────────────────────────────────────────────────────────────────────────
    class CafeFrontScene extends Phaser.Scene {
        constructor() { super({ key: 'CafeFrontScene' }); }

        create() {
            const W = this.scale.width, H = this.scale.height;

            const bg = this.add.image(W / 2, H / 2, 'cafefront');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            startLeaves(this);
            addTopUI(this);

            // Pulsing enter button — centred
            const enterBtn = this.add.image(W / 2, H / 2, 'enterbutton2').setDepth(15);
            const btnH = Math.min(H * 0.14, 120);
            const sc = btnH / enterBtn.height;
            enterBtn.setScale(sc);

            this.tweens.add({ targets: enterBtn, scale: sc * 1.1, duration: 750, ease: 'Sine.InOut', yoyo: true, repeat: -1 });

            enterBtn.setInteractive({ useHandCursor: true });
            enterBtn.on('pointerdown', () => {
                this.tweens.killTweensOf(enterBtn);
                this.cameras.main.fadeOut(350, 0, 0, 0);
                this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('InsideCafeScene'));
            });
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // INSIDE CAFE SCENE  — interior, full HUD, NO leaves
    // ─────────────────────────────────────────────────────────────────────────
    class InsideCafeScene extends Phaser.Scene {
        constructor() { super({ key: 'InsideCafeScene' }); }

        create() {
            const W = this.scale.width, H = this.scale.height;
            this.cameras.main.fadeIn(350, 0, 0, 0);

            const bg = this.add.image(W / 2, H / 2, 'insidecafe');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            addTopUI(this);
            addBottomButtons(this, () => showInventoryOverlay(this));
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // MAP SCENE
    // ─────────────────────────────────────────────────────────────────────────
    class MapScene extends Phaser.Scene {
        constructor() { super({ key: 'MapScene' }); }

        create() {
            const W = this.scale.width, H = this.scale.height;
            this.cameras.main.fadeIn(300, 0, 0, 0);

            const bg = this.add.image(W / 2, H / 2, 'map');
            bg.setScale(Math.max(W / bg.width, H / bg.height)).setDepth(0);

            // Back button
            const backH = Math.min(H * 0.055, 46);
            const backW = backH * 2.6;
            const g = this.add.graphics().setDepth(20);
            g.fillStyle(0x000000, 0.5);
            g.fillRoundedRect(16, 16, backW, backH, backH / 2);
            this.add.text(16 + backW / 2, 16 + backH / 2, '✕  Back', {
                fontSize: Math.round(backH * 0.48) + 'px', fill: '#ffffff', fontFamily: 'Arial, sans-serif'
            }).setOrigin(0.5).setDepth(21);

            this.add.zone(16, 16, backW, backH).setOrigin(0).setDepth(22)
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', () => {
                    this.cameras.main.fadeOut(300, 0, 0, 0);
                    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('InsideCafeScene'));
                });
        }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // PHASER CONFIG
    // ─────────────────────────────────────────────────────────────────────────
    new Phaser.Game({
        type: Phaser.AUTO,
        backgroundColor: '#1a1a2e',
        scale: {
            mode: Phaser.Scale.RESIZE,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
        },
        scene: [BootScene, CafeFrontScene, InsideCafeScene, MapScene]
    });
    </script>
</body>
</html>
